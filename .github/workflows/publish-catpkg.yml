# Build New Recruit / BattleScribe packages for every published GitHub release.
name: Publish New Recruit package

on:
  release:
    types: [published, edited]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: BSData/publish-catpkg@v1
